<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meal Planner</title>

<meta name="theme-color" content="#c8a96e">

<link rel="manifest" href="meal_planner_manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600&family=Playfair+Display:wght@400;600&family=Space+Mono&display=swap" rel="stylesheet">

<link rel="stylesheet" href="cookbook_menu_stylesheet.css?v=6">
<link rel="stylesheet" href="meal_planner_calendar.css?v=3">
<link rel="stylesheet" href="button_style.css?v=1">
</head>

<body>

<!-- TOOLBAR (above the container) -->
<header class="cookbook-toolbar">
  <h3 id="pageTitle">📅 &nbsp;Meal Planner :</h3>
  <div class="notepad-date" id="dateDisplay"></div>
  <div class="help-btn-wrap">
    <div class="help-btn" id="helpBtn" onclick="show_help_modal()">?</div>
    <div class="help-btn-label">help</div>
  </div>
</header>

<p id="mainPageDescription">Plan your meals by the day. Choose a day from the calendar to plan a meal, or tap a highlighted day to see what is already planned.</p>

<!-- BACK TOOLBAR -->
<div class="back-row">
  <button class="orange-btn" id="toolbarBackBtn" onclick="window.location.href='full_version_index.html'">← Back</button>
</div>

<!-- Shown when a recipe was sent here from the Cookbook -->
<div id="pending-banner" class="pending-banner" style="display:none;"></div>

<!-- CONTAINER -->
<main class="main">

  <!-- Prompt above the calendar (changes with what you are doing) -->
  <div class="cal-prompt" id="cal-prompt"></div>

  <!-- Month toolbar row -->
  <div class="cal-toolbar">
    <button class="orange-btn cal-nav" id="cal-prev" aria-label="Previous month">◀</button>
    <div class="cal-month-title" id="cal-month-title"></div>
    <button class="orange-btn cal-nav" id="cal-next" aria-label="Next month">▶</button>
  </div>

  <!-- Days of the week + month grid -->
  <div class="cal-weekdays">
    <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
  </div>
  <div class="cal-grid" id="cal-grid"></div>

  <!-- 7-day list for the chosen week -->
  <div id="week-section"></div>

</main>

<!-- HELP MODAL -->
<div id="helpModalOverlay" class="help-modal-overlay" style="display:none;" onclick="hide_help_modal()">
  <div class="help-modal" onclick="event.stopPropagation()">
    <div class="help-modal-header">
      <h3>Help</h3>
      <div class="fmt-btn" onmousedown="event.preventDefault()" onclick="hide_help_modal()">✕</div>
    </div>
    <div class="help-modal-body" id="helpModalBody"></div>
  </div>
</div>

<script src="meal_planner_calendar.js?v=2"></script>
<script type="module" src="firebase_login_auth.js"></script>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('meal_planner_service_worker.js');
  }
</script>

</body>
</html>
