<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grocery Notepad</title>

  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600&family=Playfair+Display:wght@400;600&family=Space+Mono&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="grocery_list.css?v=2">
<link rel="stylesheet" href="button_style.css?v=2">
</head>

<body>

<header>
  <button class="orange-btn" onclick="handleBack()">← Back</button>
  <div class="notepad-date" id="dateDisplay"></div>
</header>

<div class="page-head">
  <h1 class="page-title">🛒 Grocery List</h1>
  <p class="page-desc">Add, check off and save your shopping lists.</p>
</div>

<main class="main">

  <div class="list-head">
    <div>
      <div class="list-name" id="listName">Default List</div>
      <div class="list-count" id="listCount"></div>
    </div>
    <button class="orange-btn" id="lockBtn" onclick="toggleLock()">🔓 Lock</button>
  </div>

  <div class="notepad-body">
    <div id="grocery-list"></div>
  </div>

  <div id="saveListContainer" class="input-row" style="display:none;">
    <input id="saveListNameInput" class="text-input" placeholder="Name this list...">
    <button class="orange-btn" onclick="confirmSaveList()">Save</button>
  </div>

  <div class="input-row">
    <input class="text-input" id="textInput" placeholder="Add item...">
    <button class="orange-btn-44" onclick="addItems()">＋</button>
    <button class="orange-btn-44" onclick="voiceInput()">🎤</button>
  </div>

  <div class="action-row">
    <button class="orange-btn" onclick="toggleSavedLists()">📋 Saved Lists</button>
    <button class="orange-btn" onclick="saveCurrentList()">Save List</button>
  </div>

</main>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service_worker.js');
}
</script>
<script>
document.getElementById('dateDisplay').textContent =
  new Date().toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
</script>

<script type="module" src="grocery_list_data.js"></script>
<script type="module" src="firebase_login_auth.js"></script>

<script src="//cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>

</body>
</html>
