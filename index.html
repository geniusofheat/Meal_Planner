<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meal Planner — Sign In/Out :</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;900&family=Crimson+Pro:ital,wght@0,400;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="index_stylesheet.css">
<link rel="manifest" href="meal_planner_manifest.json">
</head>

<body>

<!-- ── AUTH NAV BAR ── -->
<div id="auth-nav" class="card flex">

  <div id="nav-user-email" class="nav-welcome-message">Welcome, Guest :
  </div>

  <div id="sign-out-btn" class="orange-btn">Sign Out :
  </div>

</div>
<!-- ──  END AUTH NAV BAR ── -->

  <!-- ── SIGN-IN CARD ── -->
  <div id="sign-in-out" class="card">
    <div class="card-header">
      <h2>Sign In/Out :</h2>
      <hr>
    </div>
    <form id="sign-in-form" class="card-body">
      <p>Sign in with your Google account. New here? Signing in creates your account.</p>
      <button type="button" id="google-sign-in-btn" class="orange-btn">Sign in with Google :</button>
      <div class="flex" style="flex-direction:column; align-items:center; gap:10px; margin-top:5px;">
        Want to see the plans ? <a href="account_type.html" id="create-account-link" style="font-size:12px; color:var(--gold);">View Plans</a>
        Have a suggestion ? <a href="#" data-show-card="contfor-form" style="font-size:12px; color:var(--gold);">Contact Us</a>
      </div>
    </form>
    <p id="sign_in_error"></p>
  </div>
  <!-- ── SIGN-IN CARD END ── -->

  <!-- ── CONTACT FORM CARD ── -->
  <div id="contfor-form" class="card hidden">
    <div class="card-header">
      <h2 class="playfair">Contact Us :</h2>
      <hr>
      <p>If you have any comments or suggestions, please fill out the form below.</p>
    </div>
    <form id="contact_form" class="card-body">
      <input type="text" id="contact_title" placeholder="Title" class="input">
      <input type="text" id="contact_username" placeholder="Username" class="input">
      <input type="email" id="contact_email" placeholder="Email" class="input">
      <textarea id="contact_message" placeholder="Please type your message here." style="padding:10px;border-radius:6px;border:1px solid #c8a96e;background:#0f1a33;color:#fff;resize:none;height:100px;width:100%;margin:5px 0;"></textarea>
      <button type="submit" id="contact_submit_btn" class="orange-btn">Send Message :</button>
      <p style="font-size:12px;"><a href="#" data-show-card="sign-in-out" style="color:var(--gold);">Back to Sign In</a></p>
    </form>
  </div>
  <!-- ── CONTACT FORM CARD END ── -->

<script type="module" src="firebase_login_auth.js"></script>
<script type="module" src="index_data.js"></script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('meal_planner_service_worker.js');}</script>

</body>
</html>
