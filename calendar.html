<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar</title>

<meta name="theme-color" content="#F6F3EC">

<link rel="manifest" href="meal_planner_manifest.json">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600&family=Geologica:wght@400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="cookbook_menu_stylesheet.css?v=16">
<link rel="stylesheet" href="meal_planner_calendar.css?v=12">
<link rel="stylesheet" href="recipes_menu_style.css?v=3">
<link rel="stylesheet" href="meal_planner_style.css?v=15">
</head>

<body>

<header class="cookbook-toolbar">
  <button class="orange-btn" id="toolbarBackBtn" onclick="window.location.href='meal_planner_full.html'">← Back</button>
  <div class="notepad-date" id="dateDisplay"></div>
  <button class="help-btn" id="helpBtn" onclick="show_help_modal()" aria-label="Help"><span class="help-q">?</span><span class="help-word">help</span></button>
</header>

<div class="title-line"><h3 id="pageTitle" class="page-title">Calendar</h3></div>

<p id="mainPageDescription">Tap a date on the calendar to open its week. Use Plan a Meal to add recipes, or Plan Events to pin events to dates.</p>

<!-- Shown when a recipe was sent here from the Cookbook -->
<div id="pending-banner" class="pending-banner" style="display:none;"></div>

<!-- CONTAINER -->
<!-- MODE BUTTONS: plan a meal / plan events -->
<div class="mode-row">
  <button class="orange-btn mode-btn" id="mode-meal" type="button">Plan a Meal</button>
  <button class="orange-btn mode-btn" id="mode-events" type="button">Plan Events</button>
</div>

<main class="main">

  <!-- Prompt above the calendar (changes with what you are doing) -->
  <div class="cal-prompt" id="cal-prompt"></div>

  <!-- Month toolbar row -->
  <div class="cal-toolbar">
    <button class="orange-btn cal-nav" id="cal-prev" aria-label="Previous month">◀</button>
    <div class="cal-month-title" id="cal-month-title"></div>
    <button class="orange-btn cal-nav" id="cal-next" aria-label="Next month">▶</button>
  </div>

  <!-- Days of the week + month grid -->
  <div class="cal-weekdays">
    <div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div>
  </div>
  <div class="cal-grid" id="cal-grid"></div>

  <!-- 7-day list for the chosen week -->
  <div id="week-section"></div>

</main>

<!-- HELP MODAL -->
<div id="helpModalOverlay" class="help-modal-overlay" style="display:none;" onclick="hide_help_modal()">
  <div class="help-modal" onclick="event.stopPropagation()">
    <div class="help-modal-header">
      <h3>Help</h3>
      <div class="fmt-btn" onmousedown="event.preventDefault()" onclick="hide_help_modal()">✕</div>
    </div>
    <div class="help-modal-body" id="helpModalBody"></div>
  </div>
</div>

<script src="cookbook_json.js?v=5"></script>
<script src="meal_planner_calendar.js?v=22"></script>
<script type="module" src="firebase_login_auth.js"></script>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('meal_planner_service_worker.js');
  }
</script>

</body>
</html>
