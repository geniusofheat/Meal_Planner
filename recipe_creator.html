<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recipe Creator</title>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600&family=Playfair+Display:wght@400;600&family=Space+Mono&display=swap" rel="stylesheet">
<link rel="manifest" href="meal_planner_manifest.json">
<link rel="stylesheet" href="recipe_tools.css?v=2">
<link rel="stylesheet" href="button_style.css?v=2">
</head>
<body>

<nav class="nav-row">
  <button class="orange-btn" onclick="window.location.href='meal_planner_full.html'">← Back</button>
  <div class="nav-date" id="dateDisplay"></div>
</nav>

<div class="page-head">
  <h3 class="page-title">✏️ Recipe Creator :</h3>
  <p class="page-desc">Create a recipe card with the same layout as the recipes in the recipe menu.</p>
</div>

<div id="plan-target-note" class="target-note" style="display:none;"></div>

<div class="panel">
  <div class="label">Recipe name</div>
  <input class="field" id="r_name" placeholder="Recipe name" autocomplete="off">

  <div class="label">Servings</div>
  <input class="field" id="r_servings" placeholder="Serving size (e.g. Serves 4)" autocomplete="off">

  <div class="label">Ingredients</div>
  <div id="r_ingredients"></div>
  <div class="btn-row"><button class="orange-btn" onclick="addIngredient()">+ Add Ingredient</button></div>

  <div class="label">Preparation (one step per line)</div>
  <textarea class="field" id="r_prep" placeholder="Preparation steps"></textarea>

  <div class="label">Notes (optional)</div>
  <textarea class="field" id="r_notes" style="min-height:70px" placeholder="Tips, substitutions..."></textarea>

  <div class="btn-row"><button class="orange-btn" onclick="saveRecipe()">Save Recipe</button></div>
  <div class="msg" id="r_msg"></div>
  <div class="btn-row hidden" id="r_after">
    <a class="orange-btn hidden" id="r_plan" href="meal_planner.html">Plan Recipe</a>
    <a class="orange-btn" href="favorite_recipes.html">Open Favorite Recipes</a>
  </div>
</div>

<script>
// Shown only when a day was chosen with the + button in the Meal Planner
(function () {
  try {
    var t = JSON.parse(localStorage.getItem('mealplanner_target_date') || 'null');
    if (!t || !t.iso || (Date.now() - t.t) > 30 * 60 * 1000) return;
    var p = t.iso.split('-').map(Number);
    var label = new Date(p[0], p[1] - 1, p[2]).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
    var el = document.getElementById('plan-target-note');
    el.innerHTML = '<b>Planning a meal for ' + label + '.</b> Create your recipe and press Save Recipe, then press the Plan button that appears.';
    el.style.display = 'block';
  } catch (e) {}
})();
</script>
<script src="recipe_creator.js?v=2"></script>
<script>if('serviceWorker' in navigator){ navigator.serviceWorker.register('meal_planner_service_worker.js'); }</script>
</body>
</html>
